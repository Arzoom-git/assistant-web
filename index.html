<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>緋</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="緋">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@300;400;500&family=Martian+Mono:wght@300;400&display=swap">
<style>
/* 緋（對應「扉」）：記帳＋工作日誌的共同入口。她站在四道扉中間；扉＝大廳四面的門。
   助理：大廳（問候、一則建議、四方の扉、跟她說）＋房間（直接內嵌記帳與工作日誌）。
   米白木漏れ日、背景是呼吸的霧；青磁只給能點的主要動作；她的聲音用宋體，數字用等寬字。只做淺色（使用者指定）。 */
:root{
  --bg:#F4F1EA; --surf:#FBF9F4; --ink:#22251F; --soft:#4C5047; --mute:#6E7068; --line:#DCD7CB; --mark:rgba(34,37,31,.07);
  --acc:#2F6B5F; --on-acc:#F5F3EC; --warn:#A4482E;
  --hi:#B5452E; --on-hi:#FBF3EE; /* 緋：她的顏色，只用在她自己（角印、球、呼喚的小點），不給按鈕 */
  --f-voice:"Noto Serif TC","PMingLiU",serif; --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --f-num:"Martian Mono",ui-monospace,monospace;
  --calm:cubic-bezier(.4,0,.2,1); --in:cubic-bezier(.4,0,1,1);
  --r-lg:28px; --r-sm:16px; --lift:0 24px 60px -32px rgba(34,37,31,.45);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
html,body{overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
.stone:active,.door:active{background:var(--surf);box-shadow:inset 0 0 0 1.5px var(--ink)}
.grab{display:none}
@media (max-width:1023px){.grab{display:block;width:40px;height:5px;border-radius:5px;background:var(--line);margin:10px auto -14px;flex:none}}
.edge-back{position:absolute;left:0;top:0;bottom:0;width:18px;z-index:3;touch-action:none}
@media (min-width:1024px){.edge-back{display:none}}
::view-transition-group(roomtitle){animation-duration:520ms;animation-timing-function:cubic-bezier(.4,0,.2,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:380ms;animation-timing-function:cubic-bezier(.4,0,.2,1)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
.num{font-family:var(--f-num);font-weight:300;font-variant-numeric:tabular-nums}
.soft{color:var(--soft)}
#fog{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
@keyframes surface{from{opacity:0;transform:translateY(14px);filter:blur(6px)}}
@keyframes sink{to{opacity:0;transform:translateY(18px) scale(.97);filter:blur(4px)}}
@keyframes fade{from{opacity:0}}
.surface{animation:surface 640ms var(--calm) both}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:500;white-space:nowrap;transition:transform 180ms var(--calm),background-color 180ms var(--calm)}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--acc);color:var(--on-acc)}
.btn.ghost{background:color-mix(in srgb,var(--surf) 85%,transparent);box-shadow:inset 0 0 0 1px var(--line)}
.btn.text{padding:0 12px;color:var(--soft)}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 12px;border-radius:999px;font-size:13px;box-shadow:inset 0 0 0 1px var(--line);color:var(--soft);white-space:nowrap;background:var(--surf)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{min-height:36px;padding:0 14px;border-radius:999px;font-size:14px;box-shadow:inset 0 0 0 1px var(--line);background:var(--bg)}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}

/* ---------- 大廳（手機：飛び石；電腦：四方の扉＋球） ---------- */
.shell{position:relative;z-index:1;min-height:100%}
.hall{min-height:100%;display:flex;flex-direction:column;max-width:440px;margin:0 auto;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:calc(22px + env(safe-area-inset-top,0px));font-size:14px;color:var(--soft);letter-spacing:.06em}
.top .st{display:inline-flex;align-items:center;gap:8px}
.top .st i{width:6px;height:6px;border-radius:50%;background:var(--mute)}
.top .st.on i{background:var(--ink)}
.top .st.sync i{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.25}}
.voice{padding:64px 0 6px;display:flex;flex-direction:column;gap:12px}
.voice h1{margin:0;font:300 36px/1.28 var(--f-voice);text-wrap:balance}
.voice p{margin:0;font:400 17px/1.85 var(--f-voice);color:var(--soft)}
.ask{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px}
.ask .q{font:400 19px/1.6 var(--f-voice);flex:1 0 100%}
.stones{position:relative;flex:1;min-height:300px;margin:18px 0 8px}
.who-mark{display:inline-flex;align-items:center;gap:10px}
.seal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--hi);color:var(--on-hi);font:500 15px/1 var(--f-voice);letter-spacing:0}
.mon{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.stone{position:absolute;display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:color-mix(in srgb,var(--surf) 90%,transparent);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);will-change:transform}
.stone .mon{width:32px;height:32px}
.stone.lit::after,.door.lit::after{content:"";position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--hi);box-shadow:0 0 0 3px var(--bg)}
.stone.quiet,.door.quiet{opacity:.55}
.dock{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:0}
.say{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--surf) 92%,transparent);border-radius:999px;padding:5px 5px 5px 20px;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow 180ms}
.say:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.say .who{font:400 14px var(--f-voice);color:var(--soft);white-space:nowrap}
.say input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;height:46px;outline:0}
.send{width:46px;height:46px;padding:0}
.send svg{width:19px;height:19px}
.frame,.orb-slot{display:none}
.hall{position:relative}
.orb-m{position:absolute;right:6px;top:calc(70px + env(safe-area-inset-top,0px));width:112px;height:112px;pointer-events:none}
.voice h1{padding-right:100px}
@media (min-width:1024px){
  .hall{max-width:none;margin:0;padding:0 clamp(230px,17vw,300px);min-height:100vh;display:grid;grid-template-columns:minmax(0,min(520px,34vw));align-content:center}
  .top{position:fixed;top:44px;left:52px;right:52px;padding:0;z-index:3;color:var(--ink)}
  .voice{padding:0 0 10px}.voice h1{font-size:clamp(44px,4.2vw,60px)}.voice p{font-size:19px}.ask .q{font-size:21px}
  .stones,.orb-m{display:none}
  .voice h1{padding-right:0}
  .dock{padding-top:34px}
  .frame{display:block;position:fixed;inset:44px;pointer-events:none;z-index:2}
  .edge{position:absolute;display:flex;align-items:center;gap:18px}
  .edge .ln{flex:1;background:rgba(34,37,31,.16)}
  .edge.h{left:0;right:0;height:0}.edge.h .ln{height:1px}.edge.t{top:0}.edge.b{bottom:0}
  .edge.v{top:0;bottom:0;width:0;flex-direction:column;align-items:flex-start}.edge.v .ln{width:1px}.edge.l{left:0}.edge.r{right:0;align-items:flex-end}
  .door{position:relative;pointer-events:auto;display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);transition:color 180ms var(--calm),box-shadow 420ms var(--calm),transform 420ms var(--calm)}
  .door:not(.quiet):hover,.door:not(.quiet):focus-visible{color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc);transform:scale(1.08)}
  .orb-slot{display:block;position:fixed;right:clamp(240px,18vw,310px);width:min(400px,26vw);top:50%;height:clamp(260px,42vh,380px);transform:translateY(-50%);z-index:1;pointer-events:none}
}

/* ---------- 房間：上面一條回大廳，下面是整個 App ---------- */
.room{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;background:var(--bg);visibility:hidden}
.room.on{visibility:visible}
.room.enter{animation:roomIn 560ms var(--calm) both}
.room.exit{animation:roomOut 260ms var(--in) forwards}
@keyframes roomIn{from{opacity:0;transform:translate(var(--dx,0),var(--dy,0));filter:blur(10px)}}
@keyframes roomOut{to{opacity:0;transform:translate(var(--dx,0),var(--dy,0));filter:blur(10px)}}
.rbar{flex:none;display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.back{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px 0 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);background:var(--surf);font-size:14px}
.back svg{width:17px;height:17px}
.rbar b{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line)}
.rbar b .mon{width:24px;height:24px}
.rbar .soft{margin-left:auto;font-size:12px}
.room iframe{flex:1;width:100%;border:0;background:var(--bg)}
.away{visibility:hidden}
.leave{animation:hallOut 360ms var(--in) forwards}
.back-in{animation:hallIn 560ms var(--calm) both}
@keyframes hallOut{to{opacity:0;transform:translate(var(--dx,0),var(--dy,0)) scale(.985);filter:blur(10px)}}
@keyframes hallIn{from{opacity:0;transform:translate(var(--dx,0),var(--dy,0)) scale(.985);filter:blur(10px)}}

/* ---------- 面板（確認、金鑰） ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(244,241,234,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade 420ms var(--calm)}
.sheet{position:fixed;inset:auto 0 0 0;z-index:21;display:flex;justify-content:center;pointer-events:none;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
.panel{pointer-events:auto;width:100%;max-width:540px;background:var(--surf);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line),var(--lift);max-height:88vh;display:flex;flex-direction:column;animation:surface 420ms var(--calm)}
.panel.out{animation:sink 180ms var(--in) forwards}
.pbody{overflow:auto;padding:26px 22px 14px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font:300 27px/1.3 var(--f-voice)}
.quote{margin:-6px 0 0;font-size:14px;color:var(--soft)}
.pacts{display:flex;gap:8px;padding:10px 18px 18px;flex-wrap:wrap}
.pacts .grow{flex:1}
.rows{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 18px;border-radius:20px;background:var(--bg)}
.crow .k{display:block;font-size:11px;color:var(--soft);letter-spacing:.1em}
.crow .w{display:block;font-weight:500}
.crow .s{display:block;font-size:13px;color:var(--soft)}
.crow .a{font:300 19px var(--f-num)}
.crow .pick{grid-column:1/-1;margin-top:6px}
.crow .pick .g{font-size:12px;color:var(--soft);align-self:center;min-width:4.5em}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;color:var(--soft);letter-spacing:.06em}
.inp{width:100%;min-height:46px;border:0;border-radius:var(--r-sm);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);padding:10px 16px;font-size:16px;outline:0}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
textarea.inp{min-height:84px;resize:vertical;font-family:var(--f-num);font-size:14px}
.commit{position:relative;overflow:hidden}
.commit .cdl{position:absolute;inset:0;background:rgba(245,243,236,.18);transform-origin:left;transform:scaleX(calc(1 - var(--p,0)));pointer-events:none}
@media (min-width:1024px){.sheet{inset:0;padding:28px;align-items:center}.sheet .panel{width:560px}}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:12px;max-width:min(560px,calc(100% - 24px));padding:10px 10px 10px 20px;border-radius:999px;background:var(--ink);color:var(--bg);font:400 15px var(--f-voice);animation:surface 420ms var(--calm)}
.toast:not(:has(.btn)){padding-right:20px}
.toast .btn{min-height:36px;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px}
.toast.out{animation:sink 300ms var(--in) forwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fog" aria-hidden="true"></canvas>
<div class="shell" id="shell">
  <div class="frame" id="frame" aria-label="房間"></div>
  <div class="orb-slot" id="orbSlot" aria-hidden="true"></div>
  <main class="hall" id="hall">
    <header class="top"><span class="who-mark"><span class="seal" aria-label="緋">緋</span><span id="date"></span></span><span class="st" id="st"><i></i><span></span></span></header>
    <div class="orb-m" id="orbM" aria-hidden="true"></div>
    <section class="voice" id="voice" aria-live="polite"></section>
    <section class="stones" id="stones" aria-label="今天的事"></section>
    <div class="dock">
      <div class="chips" id="chips" aria-live="polite"></div>
      <form class="say" id="say" autocomplete="off">
        <label for="msg" class="who">跟緋說</label>
        <input id="msg" type="text" enterkeyhint="send" autocomplete="off">
        <button type="submit" class="btn pri send" aria-label="送出"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </form>
    </div>
  </main>
</div>
<section class="room" id="room" aria-label="房間">
  <div class="edge-back" id="edgeBack" aria-hidden="true"></div>
  <header class="rbar"><button type="button" class="back" data-act="leave" aria-label="回到大廳"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>大廳</button><b id="roomName"></b><span class="soft" id="roomHint"></span></header>
</section>
<div id="layer"></div>
<div id="toastSlot"></div>
<script>
'use strict';
/* 記帳 App 的查詢小工具與「一句話記帳」解析：建置時直接從 ledger-app/src/App.html 取出（不另外抄一份），包在 LG 裡 */
const LG = (() => {
const S = { data: null, pref: {} };
const CARRY = '(上期滾入)';
const byOrder = (a, b) => (a.order || 0) - (b.order || 0);
/* ───────────── 查詢小工具 ───────────── */

const acc = id => S.data.accounts.find(a => a.id === id);
const cat = id => S.data.categories.find(c => c.id === id);
const activeAccounts = type => S.data.accounts.filter(a => !a.disabled && (!type || a.type === type)).sort(byOrder);
const activeCats = kinds => S.data.categories.filter(c => !c.disabled && (!kinds || kinds.includes(c.kind))).sort(byOrder);
const kindsForType = t => t === '支出' ? ['支出'] : t === '收入' ? ['收入'] : ['資產配置', '轉帳'];
function groupsOf(kinds) {
  const out = [];
  activeCats(kinds).forEach(c => { if (!out.includes(c.group)) out.push(c.group); });
  return out;
}
const expenseGroups = () => groupsOf(['支出']);
function catLabel(c) {
  if (!c) return '未分類';
  return ['收入', '轉帳', '資產配置'].includes(c.group) ? c.name : c.group + '・' + c.name;
}
const accName = id => (acc(id) || {}).name || '未指定';

const cycles = () => S.data.cycles || [];
const currentCycle = () => cycles()[cycles().length - 1];
function cycleFor(time) {
  let id = cycles().length ? cycles()[0].id : '';
  cycles().forEach(cy => { if (cy.start <= time) id = cy.id; });
  return id;
}
const budgetOf = cid => (S.data.budgets || {})[cid] || {};
function sumBy(cid, pick) {
  const out = {};
  Object.keys(S.data.summary || {}).forEach(k => {
    const [c, catId] = k.split('|');
    if (c !== cid) return;
    const ct = cat(catId);
    const key = ct && pick(ct);
    if (key) out[key] = (out[key] || 0) + S.data.summary[k];
  });
  return out;
}
const spentByGroup = cid => sumBy(cid, c => c.kind === '支出' ? c.group : null);
const kindTotal = (cid, kind) => sumBy(cid, c => c.kind === kind ? 'x' : null).x || 0;
function unallocated(cid) {
  const b = budgetOf(cid);
  let allocated = 0;
  Object.keys(b).forEach(g => { if (g !== CARRY) allocated += b[g]; });
  return kindTotal(cid, '收入') + (b[CARRY] || 0) - kindTotal(cid, '資產配置') - allocated;
}


const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
function fixedGroups() {
  return { 固定支出: true };
}

function parseInput(text) {
  let t = ' ' + text.replace(/\s+/g, ' ').trim() + ' ';
  const now = new Date();
  let day = null;
  let hm = null;

  const rel = [['大前天', -3], ['前天', -2], ['昨天', -1], ['昨晚', -1], ['今天', 0], ['今晚', 0]];
  for (const [w, n] of rel) if (t.includes(w)) { day = addDays(startOfDay(now), n); t = t.replace(w, ' '); break; }
  let m = t.match(/(\d{1,2}):(\d{2})/);
  if (m) { hm = [Number(m[1]), Number(m[2])]; t = t.replace(m[0], ' '); }
  m = t.match(/(\d{1,2})月(\d{1,2})[日號]?/) || t.match(/(?:^|\s)(\d{1,2})\/(\d{1,2})(?=\s)/);
  if (m) {
    day = new Date(now.getFullYear(), Number(m[1]) - 1, Number(m[2]));
    if (day - now > 864e5) day = new Date(now.getFullYear() - 1, Number(m[1]) - 1, Number(m[2]));
    t = t.replace(m[0], ' ');
  }
  m = t.match(/(上)?(?:週|星期|禮拜)([一二三四五六日天])/);
  if (m) {
    const wd = '日一二三四五六'.indexOf(m[2] === '天' ? '日' : m[2]);
    const today = now.getDay();
    let diff = (today - wd + 7) % 7;
    if (m[1]) diff = ((today + 6) % 7) + 7 - ((wd + 6) % 7);
    day = addDays(startOfDay(now), -diff);
    t = t.replace(m[0], ' ');
  }

  let amount = '';
  const nums = Array.from(t.matchAll(/(\d[\d,]*(?:\.\d+)?)\s*(?:元|塊)?/g));
  if (nums.length) {
    const last = nums[nums.length - 1];
    amount = Math.round(Number(last[1].replace(/,/g, '')));
    t = t.slice(0, last.index) + ' ' + t.slice(last.index + last[0].length);
  }

  let accountId = '';
  let method = '';
  const accs = activeAccounts().slice().sort((a, b) => b.name.length - a.name.length);
  for (const a of accs) {
    if (a.name.length >= 2 && t.includes(a.name)) { accountId = a.id; t = t.replace(a.name, ' '); break; }
  }
  let tokens = t.trim().split(' ').filter(Boolean);
  if (!accountId) {
    const words = { '刷卡': '信用卡', '信用卡': '信用卡', '卡': '信用卡', '現金': '現金', '扣款': '銀行', '轉帳': '銀行' };
    const i = tokens.findIndex(x => words[x]);
    if (i >= 0) { method = words[tokens[i]]; tokens.splice(i, 1); }

    p.style.transition = 'transform 260ms cubic-bezier(.4,0,.2,1)';
    if ((dy > 90 || v > .6) && store.get(K_KEY)) { p.style.transform = 'translateY(110%)'; draft = null; REC = null; stopCd(); setTimeout(() => { $('#layer').innerHTML = ''; }, 240); }
    else p.style.transform = '';
  };
  p.addEventListener('pointerup', end); p.addEventListener('pointercancel', end);
}
function closeSheet() {
  stopCd(); const p = $('#layer .panel'); if (!p) return;
  if (reduce.matches) { $('#layer').innerHTML = ''; return; }
  p.classList.add('out'); setTimeout(() => { if ($('#layer .panel.out')) $('#layer').innerHTML = ''; }, 180);
}
let toastT, undoList = null;
function toast(text, canUndo, done) {
  clearTimeout(toastT); undoList = canUndo ? done : null;
  $('#toastSlot').innerHTML = `<div class="toast" role="status"><span>${esc(text)}</span>${canUndo ? '<button type="button" class="btn" data-act="undo">復原</button>' : ''}</div>`;
  toastT = setTimeout(() => { const t = $('#toastSlot .toast'); if (!t) return; t.classList.add('out'); setTimeout(() => { $('#toastSlot').innerHTML = ''; undoList = null; }, 300); }, canUndo ? 6000 : 3200);
}

/* ================= 事件 ================= */
const ACT = {
  close: () => { if (store.get(K_KEY)) { draft = null; closeSheet(); } },
  leave: () => leaveRoom(),
  tipNo: () => { S.tip = 'gone'; renderHall(false); },
  pushOn: () => pushOn(),
  undo: () => { const d = undoList; if (!d) return; undoList = null; $('#toastSlot').innerHTML = ''; undo(d); },
  talkCancel: () => { draft = null; closeSheet(); },
  talkEdit: () => { draft = null; closeSheet(); msg.focus(); },
  talkCommit: () => { stopCd(); commitTalk(); },
  ok: () => closeSheet(),
  ask: () => { closeSheet(); setTimeout(() => msg.focus(), 200); },
  recMode: b => { REC.mode = b.dataset.v; if (REC.mode === 'fix') REC.catId = ''; drawRec(); },
  recCat: b => { REC.catId = b.dataset.v; drawRec(); },
  recCancel: () => { REC = null; closeSheet(); },
  recSave: () => commitRec(),
  pickCat: b => { const x = draft.items[+b.dataset.i]; x.p.categoryId = b.dataset.v; const c = LG.cat(b.dataset.v); if (c) x.p.type = c.kind === '收入' ? '收入' : '支出'; confirmTalk(draft.text, draft.items); },
  keySave: () => { const v = ($('#keyIn').value || '').trim(); if (!v) { $('#keyIn').focus(); return; } store.set(K_KEY, v); closeSheet(); start(); },
};
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) { enterRoom(go.dataset.go, go); return; }
  const tr = e.target.closest('[data-try]'); if (tr) { msg.value = tr.textContent; renderChips(); msg.focus(); return; }
  const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#layer .panel') && store.get(K_KEY)) { draft = null; closeSheet(); } else if (S.room) leaveRoom(); }
});

/* ================= 開始 ================= */
async function start() {
  takeKeyFromUrl();
  try { const c = store.get(K_CACHE); if (c) { load(JSON.parse(c)); renderHall(true); } } catch (e) { /* 快取壞了就重抓 */ }
  if (!store.get(K_KEY)) { keyScreen(); return; }
  if (!S.L) $('#voice').innerHTML = '<p class="surface" style="animation-delay:500ms">我看一下今天。</p>';
  try { load(await call('assistant_bootstrap')); renderHall(!S.room && !$('#voice h1 + p')); }
  catch (e) { if (isAuth(e)) keyScreen('金鑰不對，請重新貼上。'); else if (!S.L) $('#voice').innerHTML = '<h1>連不上資料服務。</h1><p>確認網路後再打開一次。</p>'; else toast('目前離線，顯示上次的資料。', false); }
  const k0 = location.hash.slice(1); if (ROOMS[k0]) enterRoom(k0);
  handleSay();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.L && !S.room) refresh(); });
if ('serviceWorker' in navigator && !/localhost|127\.0\.0\.1/.test(location.hostname)) navigator.serviceWorker.register('sw.js');
start();
})();
</script>
